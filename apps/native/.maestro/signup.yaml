# 최소수집 가입 → 온보딩 10단계 → 비식별 그룹 생성 → 일정 시뮬레이션 → 계정 삭제.
appId: app.leave.mobile
env:
  PASSWORD: "test-only-password-123"
---
- launchApp:
    clearState: true
- tapOn: "가입하기"

- tapOn:
    id: "signup-email"
- inputRandomEmail
- tapOn:
    id: "signup-password"
- inputText: ${PASSWORD}
- tapOn:
    id: "signup-password-confirm"
- inputText: ${PASSWORD}
- tapOn:
    id: "signup-terms-consent"
- tapOn:
    id: "signup-data-consent"
- tapOn:
    id: "signup-age-confirmation"
- tapOn:
    id: "signup-next"

# 온보딩은 한 화면에 질문 하나씩이다. 화면마다 답한 뒤 "다음"(onboarding-next)을 누른다.
- assertVisible: "전역까지, 같이 세어드릴게요"
- tapOn:
    id: "onboarding-next"

- assertVisible: "뭐라고 부를까요?"
- tapOn:
    id: "onboarding-name"
- inputText: "lime-whale"
- tapOn:
    id: "onboarding-next"

# 군종은 단계 수를 바꾸지 않는다 — 육군도 분기마다 정기외박을 운영한다.
- assertVisible: "어느 군에 계신가요?"
- tapOn:
    id: "onboarding-branch-army"
- tapOn:
    id: "onboarding-next"

# 달력에서 입대일을 고르면 전역 예정일이 자동으로 채워진다.
- assertVisible: "언제 입대하셨나요?"
- tapOn:
    id: "onboarding-enlisted-at"
- tapOn: "1"
- tapOn:
    id: "onboarding-next"

# 계급은 입대일 기준으로 미리 골라져 있으므로 그대로 넘긴다.
- assertVisible: "지금 계급이 맞나요?"
- tapOn:
    id: "onboarding-next"

# 프로필을 저장한 뒤에 공개 이름을 묻는다(이어하기 판정이 저장된 값 두 개로 끝나도록).
- assertVisible: "친구가 찾을 이름을 정해주세요"
- tapOn:
    id: "onboarding-username"
- inputText: "limewhale"
- inputRandomNumber:
    length: 6
- tapOn:
    id: "onboarding-next"

# 정기외박 기준일은 부대마다 달라 모를 수 있다. 모르면 통째로 건너뛴다.
- assertVisible: "정기외박 기준일이 언제인가요?"
- tapOn:
    id: "onboarding-overnight-skip"

- assertVisible: "함께 쓸 그룹이 있나요?"
- tapOn:
    id: "onboarding-group-create"
- tapOn:
    id: "onboarding-group-name"
- inputText: "summer-room"
- tapOn:
    id: "onboarding-group-max"
- eraseText
- inputText: "4"
- tapOn:
    id: "onboarding-next"

# 초대코드는 이 화면에서 한 번만 보인다.
- assertVisible: "동료를 초대해보세요"
- tapOn:
    id: "onboarding-invite-done"

# 묻지 않고 알려주는 화면. 여기서 앱을 어디서 쓰는지 익힌다.
- assertVisible: "리브는 이렇게 써요"
- assertVisible: "달력에서 휴가를 등록해요"
- tapOn:
    id: "onboarding-next"

- assertVisible: "준비 끝났어요"
- tapOn:
    id: "onboarding-complete"

# 달력에서 기본 날짜를 시뮬레이션·저장한다.
- assertVisible: "부대 달력"
- tapOn: "휴가 등록"
- assertVisible: "이 계획을 더하면"
- tapOn:
    id: "leave-form-submit"

# 내 휴가 목록에서 현재 상태를 확인하고 한 번의 터치로 바꾼다.
- tapOn: "내 휴가"
- assertVisible: "상태 · 희망"
- assertVisible: "초안"
- assertVisible: "신청함"
- tapOn: "신청함"
- assertVisible: "상태 · 신청함"

# 인앱 영구 삭제 경로가 실제로 노출되고 확인을 요구하는지 검증한다.
- tapOn: "프로필"
- tapOn:
    id: "profile-service-progress-card"
- assertVisible:
    id: "service-progress-main"
- assertNotVisible: "실시간 확대"
- tapOn:
    id: "service-progress-main"
- assertVisible: "클릭한다고 복무율이 빠르게 올라가지 않아요"
- tapOn:
    id: "service-progress-close"
- assertVisible:
    id: "profile-service-progress-card"
- tapOn:
    id: "delete-account"
- assertVisible: "계정과 데이터 영구 삭제"
- tapOn: "영구 삭제"
- assertVisible: "로그인"
