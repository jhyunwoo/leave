# 최소수집 가입 → 비식별 그룹 생성 → 일정 시뮬레이션 → 계정 삭제 핵심 흐름.
appId: app.leave.mobile
env:
  PASSWORD: "test-only-password-123"
---
- launchApp:
    clearState: true
- tapOn: "가입하기"

- tapOn:
    id: "signup-email"
- inputRandomEmail
- tapOn:
    id: "signup-password"
- inputText: ${PASSWORD}
- tapOn:
    id: "signup-password-confirm"
- inputText: ${PASSWORD}
- tapOn:
    id: "signup-name"
- inputText: "lime-whale"
- tapOn:
    id: "signup-terms-consent"
- tapOn:
    id: "signup-data-consent"
- tapOn:
    id: "signup-age-confirmation"
- tapOn:
    id: "signup-next"

- assertVisible: "아직 공유 그룹이 없어요"
- tapOn: "그룹 참여·만들기"
- tapOn:
    id: "create-unit-open"
- tapOn:
    id: "create-unit-name"
- inputText: "summer-room"
- tapOn:
    id: "create-unit-reference-total"
- inputText: "20"
- tapOn:
    id: "create-unit-max-out"
- eraseText
- inputText: "4"
- tapOn:
    id: "create-unit-submit"
- assertVisible: "지금 초대코드를 보관하세요"

# form-sheet를 닫고 달력에서 기본 날짜를 시뮬레이션·저장한다.
- back
- assertVisible: "참고용 추정치"
- tapOn: "휴가 등록"
- assertVisible: "이 계획을 더하면"
- tapOn:
    id: "leave-form-submit"

# 인앱 영구 삭제 경로가 실제로 노출되고 확인을 요구하는지 검증한다.
- tapOn: "프로필"
- tapOn:
    id: "delete-account"
- assertVisible: "계정과 데이터 영구 삭제"
- tapOn: "영구 삭제"
- assertVisible: "로그인"
