# 동의 기반 회원가입 흐름.
# 참고: 2단계의 입대일/전역일은 네이티브 DatePicker라 기기/OS별로 조작이 달라
#       환경에 맞춰 tapOn 좌표나 값을 조정해야 할 수 있다. 안정적인 자동화를 위해
#       입력 필드에 testID를 부여하는 것을 권장한다(현재는 문구/placeholder 기반).
appId: app.leave.mobile
env:
  PASSWORD: "password123"
---
- launchApp:
    clearState: true
- tapOn: "가입하기"

# 1단계: 계정
- tapOn:
    id: "signup-email"
- inputRandomEmail
- tapOn:
    id: "signup-password"
- inputText: ${PASSWORD}
- tapOn:
    id: "signup-password-confirm"
- inputText: ${PASSWORD}
- tapOn:
    id: "signup-name"
- inputText: "이순신"
- tapOn:
    id: "signup-next"

# 2단계: 군 정보 (기본값 육군/이병 사용, 날짜는 환경에 맞게 조정)
- assertVisible: "입대일"
# TODO: DatePicker 조작 — 기기별로 상이. 예시:
# - tapOn: "입대일"
# - ... (날짜 선택) ...
- tapOn:
    id: "signup-next"

# 3단계: 동의 후 가입
- assertVisible:
    text: "동의합니다"
- tapOn:
    id: "signup-data-consent"
- tapOn:
    id: "signup-next"

# 가입 성공 시 탭 화면(부대/달력 등)으로 진입
- assertVisible: "부대"
