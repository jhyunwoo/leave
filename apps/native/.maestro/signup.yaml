# 최소수집 가입 → 온보딩 8단계 → 비식별 그룹 생성 → 일정 시뮬레이션 → 계정 삭제.
appId: app.leave.mobile
env:
  PASSWORD: "test-only-password-123"
---
- launchApp:
    clearState: true
- tapOn: "가입하기"

- tapOn:
    id: "signup-email"
- inputRandomEmail
- tapOn:
    id: "signup-password"
- inputText: ${PASSWORD}
- tapOn:
    id: "signup-password-confirm"
- inputText: ${PASSWORD}
- tapOn:
    id: "signup-terms-consent"
- tapOn:
    id: "signup-data-consent"
- tapOn:
    id: "signup-age-confirmation"
- tapOn:
    id: "signup-next"

# 온보딩은 한 화면에 질문 하나씩이다. 화면마다 답한 뒤 "다음"(onboarding-next)을 누른다.
- assertVisible: "전역까지, 같이 세어드릴게요"
- tapOn:
    id: "onboarding-next"

- assertVisible: "뭐라고 부를까요?"
- tapOn:
    id: "onboarding-name"
- inputText: "lime-whale"
- tapOn:
    id: "onboarding-next"

# 육군을 고르면 정기외박 단계가 빠져 단계가 하나 줄어든다.
- assertVisible: "어느 군에 계신가요?"
- tapOn:
    id: "onboarding-branch-army"
- tapOn:
    id: "onboarding-next"

# 달력에서 입대일을 고르면 전역 예정일이 자동으로 채워진다.
- assertVisible: "언제 입대하셨나요?"
- tapOn:
    id: "onboarding-enlisted-at"
- tapOn: "1"
- tapOn:
    id: "onboarding-next"

# 계급은 입대일 기준으로 미리 골라져 있으므로 그대로 넘긴다.
- assertVisible: "지금 계급이 맞나요?"
- tapOn:
    id: "onboarding-next"

# 육군이라 정기외박을 건너뛰고 바로 그룹 단계로 온다.
- assertVisible: "함께 쓸 그룹이 있나요?"
- tapOn:
    id: "onboarding-group-create"
- tapOn:
    id: "onboarding-group-name"
- inputText: "summer-room"
- tapOn:
    id: "onboarding-group-max"
- eraseText
- inputText: "4"
- tapOn:
    id: "onboarding-next"

# 초대코드는 이 화면에서 한 번만 보인다.
- assertVisible: "동료를 초대해보세요"
- tapOn:
    id: "onboarding-invite-done"

- assertVisible: "준비 끝났어요"
- tapOn:
    id: "onboarding-complete"

# 달력에서 기본 날짜를 시뮬레이션·저장한다.
- assertVisible: "부대 달력"
- tapOn: "휴가 등록"
- assertVisible: "이 계획을 더하면"
- tapOn:
    id: "leave-form-submit"

# 내 휴가 목록에서 현재 상태를 확인하고 한 번의 터치로 바꾼다.
- tapOn: "내 휴가"
- assertVisible: "상태 · 희망"
- assertVisible: "초안"
- assertVisible: "신청함"
- tapOn: "신청함"
- assertVisible: "상태 · 신청함"

# 인앱 영구 삭제 경로가 실제로 노출되고 확인을 요구하는지 검증한다.
- tapOn: "프로필"
- tapOn:
    id: "delete-account"
- assertVisible: "계정과 데이터 영구 삭제"
- tapOn: "영구 삭제"
- assertVisible: "로그인"
