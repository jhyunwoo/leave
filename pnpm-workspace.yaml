packages:
  - "apps/*"
  - "packages/*"

# React는 워크스페이스 전체가 한 버전이어야 한다. pnpm은 peer 의존성 해석 결과마다
# 물리적으로 다른 디렉터리를 만들기 때문에, React 버전이 갈리면 그것을 peer로 받는
# 패키지도 같이 갈라진다. 실제로 native가 19.2.3, web·admin·client가 19.2.7이던 동안
# @tanstack/react-query가 `_react@19.2.3`과 `_react@19.2.7` 두 벌로 깔렸고, 네이티브
# 번들에서 앱 코드와 @leave/client가 서로 다른 사본을 잡아 QueryClientContext가 둘로
# 갈렸다("No QueryClient set"으로 앱이 시작하자마자 멈춤).
#
# 기준 버전은 Expo SDK 57 / React Native 0.86이 요구하는 값이다. Expo를 올릴 때는
# `npx expo install --check`가 알려주는 버전으로 여기도 같이 올린다.
# 회귀 감시는 packages/client/test/single-instance.test.ts.
#
# hono도 워크스페이스 전체가 한 버전이어야 한다. 이유는 react와 다르다.
# 웹은 apps/api의 `AppType`(hono 사본 A의 타입으로 만들어진 것)을 hc<AppType>에
# 넣는데, 웹이 사본 B를 잡고 있으면 두 `Hono` 타입이 이름만 같은 남남이라
# `hc`의 제약(Hono<any, any, any>)을 통과하지 못한다. 그러면 타입 검사에서
# api 클라이언트 전체가 unknown이 되고 `pnpm build`(=tsc && vite build)가 죽는다.
# 실제로 web만 ^4.13.2로 올라가 있고 나머지는 ^4.13.0이라 4.13.1로 묶여 있어서
# 두 벌이 깔렸다(@hono/zod-openapi의 peer 해석이 4.13.1을 고정한다).
overrides:
  hono: "4.13.2"
  react: "19.2.3"
  react-dom: "19.2.3"

# sharp의 install 스크립트는 실행하지 않는다(false). pnpm의 격리된 node_modules에서
# sharp check.js가 @img/sharp-darwin-arm64를 찾지 못해 소스 빌드로 폴백하다 실패하기
# 때문이다. sharp 0.34는 @img/* 플랫폼 패키지가 설치돼 있으면(supportedArchitectures로
# 보장) install 스크립트 없이도 런타임에 해당 바이너리를 직접 로드한다.
allowBuilds:
  agent-browser: true
  esbuild: true
  sharp: false
  # eslint-import-resolver-typescript의 네이티브 바인딩. 빌드 스크립트 없이도
  # 플랫폼별 optionalDependencies로 해결돼 lint가 정상 동작한다.
  unrs-resolver: false
  workerd: true

# 승인되지 않은(=무시된) 빌드 스크립트가 있어도 설치를 실패시키지 않고 경고만 낸다.
# (CI=1에서 기본값 true면 ERR_PNPM_IGNORED_BUILDS로 실패)
strictDepBuilds: false

# EAS는 Android=linux-x64, iOS=macOS arm64 빌더를 쓴다. 리눅스에서 생성된
# lockfile이라도 두 플랫폼용 optional 바이너리(예: sharp @img/*)가 모두 설치되도록
# 대상 아키텍처를 명시한다. 미지정 시 frozen 설치가 현재 플랫폼 바이너리만 링크해
# macOS 빌더에서 sharp가 소스 빌드로 폴백하다 실패한다.
supportedArchitectures:
  os:
    - current
    - linux
    - darwin
  cpu:
    - current
    - x64
    - arm64

verifyDepsBeforeRun: false

# `npx expo install --fix`가 채우는 목록이다. pnpm 11은 갓 배포된 패키지를 기본으로
# 한 번 걸러 내는데(minimumReleaseAge), Expo SDK 패치는 나온 지 며칠 안 된 것이
# 정상이라 그 관문에 그대로 걸린다. 여기 적힌 버전만 예외로 통과시킨다.
#
# 손으로 고치지 않는다 — 다음 `expo install --fix`가 다시 쓴다. 오래돼서 lockfile에
# 없는 버전이 남아 있어도 해가 없으므로(존재하지 않는 예외일 뿐) 정리는 선택이다.
# 없애면 EAS·CI의 새 설치에서 같은 버전이 다시 걸린다.
minimumReleaseAgeExclude:
  - "@expo/cli@57.0.18"
  - "@expo/config-plugins@57.0.9"
  - "@expo/config@57.0.9"
  - "@expo/fingerprint@0.20.10"
  - "@expo/image-utils@0.11.5"
  - "@expo/metro-config@57.0.10"
  - "@expo/metro-file-map@57.0.2"
  - "@expo/prebuild-config@57.0.14"
  - "@expo/require-utils@57.0.5"
  - babel-preset-expo@57.0.8
  - expo-asset@57.0.14
  - expo-constants@57.0.14
  - expo-modules-autolinking@57.0.11
  - expo-modules-core@57.0.13
  - expo@57.0.16
  - "@expo/metro-runtime@57.0.13"
  - "@expo/ui@57.0.13"
  - expo-build-properties@57.0.14
  - expo-insights@57.0.13
  - expo-notifications@57.0.14
  - expo-router@57.0.16
  - expo-splash-screen@57.0.8
  - expo-updates@57.0.17
